name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lua and qmllint for the Lua tests and QML checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 qt6-declarative-dev-tools
      - name: Validate the plugin and run its tests
        run: scripts/check
